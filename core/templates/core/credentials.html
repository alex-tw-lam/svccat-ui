{% if message %}<div role="alert" class="alert alert-error">{{ message }}</div>{% else %}<div class="creds-wrap" x-data="smCopy"><div class="creds-head"><span class="creds-title">Credentials — {{ name }}</span><button type="button"
        class="btn btn-ghost btn-sm"
        data-dismiss="binding-creds">Hide</button></div><pre class="creds" x-ref="creds">{{ creds_json }}</pre><button type="button"
        class="btn btn-outline btn-sm"
        @click="copy()"
        x-text="copied ? 'Copied' : 'Copy credentials'">Copy credentials</button></div>{% endif %}
