{% if message %}<div role="alert" class="alert alert-error">{{ message }}</div>{% else %}<div class="creds-wrap" x-data="smCopy"><pre class="creds" x-ref="creds">{{ creds_json }}</pre><button type="button"
        class="btn btn-outline btn-sm"
        @click="copy()"
        x-text="copied ? 'Copied' : 'Copy credentials'">Copy credentials</button></div>{% endif %}
