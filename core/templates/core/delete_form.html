<form method="post" action="{{ action }}" class="inline{% if join %} join-form{% endif %}" data-confirm="{{ confirm }}" x-data="{ show: false, typed: '' }" @submit="if (typed !== '{{ name }}') { show = true; $event.preventDefault(); }"><button class="btn btn-error btn-outline{% if small %} btn-sm{% endif %}{% if join %} join-item{% endif %}" type="submit">Delete</button><div class="modal" :class="show ? 'modal-open' : ''" x-trap.inert.noscroll="show" x-cloak @keydown.escape.window="show = false"><div class="modal-box"><h3>Delete {{ name }}?</h3><p class="muted">This deprovisions the resource and destroys its data. Type <strong>{{ name }}</strong> to confirm.</p><input class="input input-bordered" x-model="typed" placeholder="{{ name }}" @keydown.enter="if (typed === '{{ name }}') { $root.querySelector('form').submit() }" /><div class="modal-action"><button type="button" class="btn btn-ghost btn-sm" @click="show = false">Cancel</button><button type="button" class="btn btn-error btn-sm" :disabled="typed !== '{{ name }}'" @click="$root.querySelector('form').submit()">Delete {{ name }}</button></div></div><label class="modal-backdrop" @click="show = false"></label></div></form>
