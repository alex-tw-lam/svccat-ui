{% extends "core/layout.html" %}{% block content %}<h1>Catalog</h1> <div class="grid">{% for o in offerings %}<a class="card card-bordered card-compact{% if o.namespaced %} current{% endif %}"
   preload
   href="/instances/new?offering={{ o.id }}&tenant={{ tenant }}"><div class="card-body"><h2 class="card-title tile-name">{{ o.name }}{% if o.namespaced %} <span class="badge info">tenant-exclusive</span>{% endif %}</h2><p class="tile-desc">{{ o.description }}</p><div class="card-actions">{% for t in o.tags %}<span class="kv">{{ t }}</span>{% endfor %}</div><div class="tile-foot"><span class="muted">{{ o.plans|length }} plans</span><span class="btn btn-primary btn-sm">Provision</span></div></div></a>{% endfor %}</div>{% endblock %}
