{% extends "core/layout.html" %}{% block content %}<h1>Create a binding</h1><form method="post"
      action="/bindings/new?tenant={{ tenant }}"
      class="card form"
      x-data="smDrawer({ submittable: {{ form.insts|yesno:'true,false' }} })"
      @submit="busy = true; if (error) $event.preventDefault()"> {% if form.error %}<div role="alert" class="alert alert-error">{{ form.error }}</div>{% endif %}<label>Instance <select name="instanceId"
         class="select select-bordered"
         hx-get="/bindings/new/freeinputs?tenant={{ tenant }}"
         hx-include="this"
         hx-target="#bind-free"
         hx-swap="innerHTML">{% for i in form.insts %}<option value="{{ i.id }}"
        {% if i.id == form.selected_id %} selected{% endif %}>{{ i.name }} ({{ i.offeringName }})</option>{% endfor %}</select></label><label>Binding name <input name="name"
        class="input input-bordered"
        value="{{ form.values.name|default:'' }}"
        placeholder="app-binding (any language is fine)"
        required /></label> <div class="adv-drawer"><div class="adv-head"><button type="button"
        class="btn btn-ghost btn-sm"
        @click="open = !open"
        :aria-expanded="open">Advanced — free inputs</button><span class="adv-state"><template x-if="error"><span class="text-error" x-text="error"></span></template> <template x-if="!error && text.trim()"><span class="muted">inputs match the bind schema</span></template></span></div><div class="drawer-body" x-show="open" x-cloak><div class="drawer-label">Bind parameters (raw JSON) — <span id="bind-free">{% include "core/bind_freeinputs.html" with hint=form.hint contract_json=form.contract_json %}</span></div> <label><textarea name="parameters"
          x-ref="params"
          x-model="text"
          rows="4"
          class="textarea textarea-bordered"
          placeholder='{ } — validated live against the bind schema'>{{ form.values.parameters|default:'' }}</textarea></label></div></div> <div class="form-actions"><button class="btn btn-primary"
        type="submit"
        :disabled="busy || !submittable || !!error"
        x-text="busy ? 'Binding…' : 'Bind'">Bind</button></div> </form>{% endblock %}
