[project]
name = "svccat-ui"
version = "0.1.0"
description = "svccat-ui: a service catalog UI on the PyHAT stack (Django + htmx + Alpine.js + DaisyUI)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django==5.2.17",
    "django-htmx>=1.29.0",
    "django-template-partials==25.3",
    "gunicorn==23.0.0",
    "kubernetes==33.1.0",
    "requests==2.33.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "coverage>=7.17.3",
    "django-debug-toolbar>=8.0.0",
    "django-extensions>=4.1",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 88
target-version = "py312"
[tool.ruff.lint]
# mechanical rules only — style opinions (blind-except etc.) are deliberately
# left out; the repaint paths catch broadly on purpose
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
source = ["core", "service_manager"]
omit = ["core/migrations/*"]

[tool.coverage.report]
show_missing = true
