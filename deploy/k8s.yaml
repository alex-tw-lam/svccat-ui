# Plain-manifest deployment for svccat-ui (the helm chart route died with the
# chart repo). The tailscale operator requires spec.tls[0].hosts[0] to equal
# the rule host (it ignores TLS-less rules) and the service port must be
# named. ClusterRole/ClusterRoleBinding `service-manager` (README RBAC
# section) are cluster-scoped and survive namespace deletion.
apiVersion: v1
kind: Namespace
metadata:
  name: service-manager
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: service-manager
  namespace: service-manager
---
apiVersion: v1
kind: Secret
metadata:
  name: service-manager-admin
  namespace: service-manager
type: Opaque
stringData:
  ADMIN_USER: admin
  ADMIN_PASSWORD: admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-manager
  namespace: service-manager
  labels: { app.kubernetes.io/name: service-manager }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: service-manager } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: service-manager }
    spec:
      serviceAccountName: service-manager
      containers:
        - name: main
          image: registry.tailf1a546.ts.net/service-manager:940bb04272b56e652cb2264ebbdf816eeb8250e6
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - name: PORT
              value: "8080"
            - name: KC_ISSUER
              value: https://keycloak.tailf1a546.ts.net/realms/platform
            - name: KC_CLIENT_ID
              value: "service-manager,sm-e2e"
            - name: FALLBACK_TENANTS
              value: team-a,team-b
            - name: ADMIN_USER
              valueFrom: { secretKeyRef: { name: service-manager-admin, key: ADMIN_USER } }
            - name: ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: service-manager-admin, key: ADMIN_PASSWORD } }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: service-manager
  namespace: service-manager
spec:
  selector: { app.kubernetes.io/name: service-manager }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: service-manager
  namespace: service-manager
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/tags: tag:k8s
spec:
  ingressClassName: tailscale
  tls:
    - hosts: [svccat-ui.tailf1a546.ts.net]
  rules:
    - host: svccat-ui.tailf1a546.ts.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: service-manager, port: { name: http } } }
