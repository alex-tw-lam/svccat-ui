# svccat-ui deploys through the homelab fleet (Flux GitOps) — the live source
# of truth is the Gitea repo:
#
#   https://gitea.tailf1a546.ts.net/homelab/fleet-mint
#     apps/service-manager/helmrelease.yaml   HelmRelease (bjw-s app-template 5.3.0)
#     apps/service-manager/rbac.yaml          ServiceAccount usage + ClusterRole/Binding
#     secrets/service-manager-admin.yaml      sops-encrypted admin credentials
#     clusters/mint/apps/app-service-manager.yaml  Flux Kustomization (dependsOn fleet-secrets)
#
# Release a new version: build + push the image to the homelab registry with
# the commit sha as the tag, then bump `tag:` in apps/service-manager/helmrelease.yaml.
# Notes baked into the fleet copy (learned live): the tailscale operator needs
# spec.tls[0].hosts[0] to equal the rule host (the chart's values.ingress tls
# covers it), and app-template defaults automountServiceAccountToken to off —
# the in-cluster k8s client needs it on.
